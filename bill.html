<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="casa 紙幣">
<meta name="theme-color" content="#0b0f0c">
<meta name="format-detection" content="telephone=no">
<title>casa SLOT 紙幣</title>
<link rel="icon" href="icon-180.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --gold: #ffd773; --dim: #9aa89c; --bg: #0b0f0c; --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #070a08; }
  html, body { margin: 0; height: 100%; background-color: #070a08; color: #e8e3d2; font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 30%, #13231a, #070a08 70%); } /* 画面の端（ホームバーの領域）まで暗い色で塗る。白い帯が出ないように */
  .hidden { display: none !important; }
  .top { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--sat) + 10px) 18px 0; text-align: center; }
  .top b { display: inline-block; padding: 10px 18px; color: var(--gold); letter-spacing: .25em; font-weight: 700; font-size: 14px; }
  .store { position: absolute; top: calc(var(--sat) + 46px); left: 0; right: 0; text-align: center; font-size: 13px; color: #cfd6cc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; }
  .store i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #35e07a; box-shadow: 0 0 8px #35e07a; margin-right: 6px; vertical-align: 1px; }
  .store.busy i { background: #ffb84d; box-shadow: 0 0 8px #ffb84d; }
  .store.off i { background: #6b7570; box-shadow: none; }

  /* ---------- サンドの前面パネル（b91、ChatGPT の助言: 厚みのある箱、口の奥に影、紙幣は箱の裏に入る） ---------- */
  .acc { position: absolute; left: 50%; top: calc(var(--sat) + 76px); width: var(--w, 300px); transform: translateX(-50%); z-index: 5; }
  .acc .plate { position: relative; height: 118px; border-radius: 16px; background: linear-gradient(180deg, #2a2314 0%, #15110a 30%, #0d0b07 70%, #1c170d 100%); box-shadow: 0 0 0 2px #000, 0 0 0 5px #c9a03e, 0 0 0 7px #000, 0 14px 0 #3a2a0c, 0 22px 30px rgba(0, 0, 0, .85), inset 0 2px 0 rgba(255, 235, 180, .3); transition: box-shadow .3s; }
  .acc .plate::before { content: ""; position: absolute; left: 12px; right: 12px; top: 8px; bottom: 8px; border: 1px solid rgba(226, 186, 92, .4); border-radius: 11px; pointer-events: none; }
  .acc .lbl { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font: 700 11px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .35em; color: #ffd773; text-shadow: 0 0 8px rgba(255, 215, 115, .6); }
  .acc .led { position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: radial-gradient(circle, #fff 0 20%, #ffd773 45%, rgba(255, 215, 115, .3) 70%, transparent 72%); box-shadow: 0 0 12px #ffd773; animation: ledblink 2.2s ease-in-out infinite; }
  .acc .led.l { left: 16px; } .acc .led.r { right: 16px; animation-delay: -1.1s; }
  @keyframes ledblink { 0%, 55%, 100% { opacity: .35; } 20% { opacity: 1; } }
  .acc .mouth { position: absolute; left: 50%; top: 40px; width: calc(var(--w, 300px) - 70px); height: 62px; transform: translateX(-50%); border-radius: 10px; background: linear-gradient(180deg, #000 0%, #050505 40%, #121009 100%); box-shadow: inset 0 10px 18px #000, inset 0 -2px 0 rgba(255, 215, 115, .25), 0 0 0 2px #c9a03e, 0 0 20px rgba(226, 186, 92, .5); overflow: hidden; transition: box-shadow .3s; }
  .acc .mouth::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, .9)); }
  .acc .mouth .throat { position: absolute; left: 10px; right: 10px; top: 8px; height: 6px; border-radius: 3px; background: #000; box-shadow: 0 1px 0 rgba(255, 255, 255, .08); }
  .acc.hot .mouth { box-shadow: inset 0 10px 18px #000, inset 0 -2px 0 rgba(255, 215, 115, .25), 0 0 0 2px #ffe9a8, 0 0 34px rgba(255, 225, 140, .95); }
  .acc.hot .led, .acc.feeding .led { animation-duration: .3s; }
  .acc.feeding .plate { box-shadow: 0 0 0 2px #000, 0 0 0 5px #ffe9a8, 0 0 0 7px #000, 0 14px 0 #3a2a0c, 0 0 40px rgba(255, 225, 140, .7), inset 0 2px 0 rgba(255, 235, 180, .4); }

  /* 紙幣: パネルの裏（z-index 低）。口の中に入るときは少し縮んで暗くなる */
  #feedClip { position: absolute; left: 0; right: 0; top: calc(var(--sat) + 116px); bottom: 0; overflow: hidden; touch-action: none; z-index: 2; }
  .bill { position: absolute; left: 50%; transform: translateX(-50%) translateY(var(--y, 0px)) scale(var(--s, 1)); transform-origin: 50% 0; filter: brightness(var(--b, 1)); will-change: transform; transition: transform .25s ease-out, filter .25s; }
  .bill svg { position: absolute; transform: rotate(-90deg); transform-origin: center; filter: drop-shadow(0 -10px 22px rgba(0, 0, 0, .8)); }
  .bill.suck { transition: transform 1.2s cubic-bezier(.5, 0, .9, .4), filter 1.2s; }
  .bill.enter { transition: transform .6s cubic-bezier(.2, .9, .3, 1), filter .3s; }
  .bill.gray svg { filter: grayscale(1) brightness(.55) drop-shadow(0 -10px 22px rgba(0, 0, 0, .75)); }
  .bill.drag { transition: none; }
  .bill.back { transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), filter .3s; }

  /* 大きな三角（紙幣より下のレイヤー） */
  .hint { position: absolute; left: 0; right: 0; top: calc(var(--sat) + 214px); text-align: center; pointer-events: none; z-index: 1; }
  .hint .arr { display: block; width: 0; height: 0; margin: 0 auto; border-left: 42px solid transparent; border-right: 42px solid transparent; border-bottom: 58px solid var(--gold); filter: drop-shadow(0 0 14px rgba(255, 215, 115, .6)); animation: up 1.4s ease-in-out infinite; }
  @keyframes up { 0%, 100% { transform: translateY(10px); opacity: .55; } 50% { transform: translateY(-10px); opacity: 1; } }
  .hint.busy .arr { animation: none; opacity: .2; filter: none; }
  .msg { position: absolute; left: 20px; right: 20px; top: calc(var(--sat) + 290px); text-align: center; font-size: 16px; color: #e8e3d2; min-height: 22px; pointer-events: none; z-index: 6; text-shadow: 0 2px 6px #000; }
  .msg.ok { color: #35e07a; } .msg.err { color: #ff8c7a; }

  /* ---------- ログイン ---------- */
  .login { position: absolute; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 24px; gap: 14px; }
  .login h1 { font-size: 20px; letter-spacing: .2em; color: var(--gold); margin: 0 0 6px; }
  .login p { margin: 0; color: var(--dim); font-size: 14px; text-align: center; }
  .login .wait { color: var(--dim); font-size: 14px; }
  .login .list { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; }
  .login button.item { width: 100%; padding: 16px; font-size: 18px; border-radius: 12px; border: 1px solid #c9a03e; background: #15120a; color: #ffe9a8; font-family: inherit; }
  .login input { width: 100%; max-width: 360px; padding: 14px; font-size: 24px; letter-spacing: .4em; text-align: center; border-radius: 12px; border: 1px solid #c9a03e; background: #0d0c08; color: #fff; -webkit-user-select: text; user-select: text; }
  .login .row { display: flex; gap: 10px; width: 100%; max-width: 360px; }
  .login .row button { flex: 1; padding: 14px; font-size: 16px; border-radius: 12px; border: 0; font-family: inherit; }
  .login .row .ok { background: linear-gradient(180deg, #ffe9a8, #c9a03e); color: #1a1408; font-weight: 700; }
  .login .row .ghost { background: #1a1a1a; color: #cfd6cc; }
  .login .err { color: #ff8c7a; font-size: 14px; min-height: 18px; }

  /* ---------- 設定（端末の設定画面と同じ項目を遠隔で） ---------- */
  .adm { position: absolute; inset: 0; z-index: 20; background: #0b0a08; display: flex; flex-direction: column; }
  .adm .head { padding: calc(var(--sat) + 12px) 14px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2416; }
  .adm .head h2 { margin: 0; font-size: 16px; color: var(--gold); letter-spacing: .2em; }
  .adm .head button { background: none; border: 1px solid #3a3a3a; color: #cfd6cc; font: inherit; padding: 8px 14px; border-radius: 10px; }
  .adm .tabs { display: flex; gap: 6px; padding: 10px 12px 0; }
  .adm .tabs button { flex: 1; padding: 11px 0; font: inherit; font-size: 14px; border-radius: 10px; border: 1px solid #3a3320; background: #15120a; color: #cfd6cc; }
  .adm .tabs button.on { background: linear-gradient(180deg, #ffe9a8, #c9a03e); color: #1a1408; font-weight: 700; border-color: #c9a03e; }
  .adm .body { flex: 1; overflow: auto; padding: 12px 14px calc(var(--sab) + 24px); -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .panel { background: #141109; border: 1px solid #2a2416; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .panel h4 { margin: 0 0 10px; font-size: 13px; letter-spacing: .15em; color: var(--gold); }
  .panel .note { font-size: 12px; color: var(--dim); margin: 0 0 8px; line-height: 1.6; }
  .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #221d10; }
  .stat:last-child { border-bottom: 0; }
  .stat span { color: var(--dim); font-size: 13px; }
  .stat b { font-size: 22px; color: #ffe9a8; font-variant-numeric: tabular-nums; }
  .stat b.mask { letter-spacing: .1em; color: #8e8672; }
  .btn { width: 100%; padding: 14px; font: inherit; font-size: 16px; border-radius: 12px; border: 1px solid #c9a03e; background: #0d0c08; color: #ffe9a8; margin-top: 8px; }
  .btn.ghost { border-color: #3a3a3a; color: #cfd6cc; background: #1a1a1a; }
  .btn.danger { border-color: #7a2a22; color: #ff9d8c; background: #1a0d0b; }
  .btn.sm { width: auto; padding: 8px 14px; font-size: 14px; margin: 0; }
  .btn:disabled { opacity: .45; }
  .plist { display: flex; flex-direction: column; gap: 8px; }
  .plist button { text-align: left; padding: 14px; font: inherit; font-size: 16px; border-radius: 12px; border: 1px solid #3a3320; background: #0d0c08; color: #e8e3d2; display: flex; justify-content: space-between; align-items: center; }
  .plist button.on { border-color: #c9a03e; background: #1c170a; color: #ffe9a8; }
  .plist button .chip { font-size: 11px; color: var(--dim); }
  .hist { font-size: 14px; }
  .hist .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #221d10; }
  .hist .row small { color: var(--dim); }
  .hist .row b { color: #ffe9a8; } .hist .row b.zero { color: #8e8672; }
  .slider { display: flex; align-items: center; gap: 10px; }
  .slider input { flex: 1; }
  .toast { position: absolute; left: 20px; right: 20px; bottom: calc(var(--sab) + 24px); z-index: 30; padding: 12px 16px; border-radius: 12px; background: #1c170a; border: 1px solid #c9a03e; color: #ffe9a8; text-align: center; font-size: 14px; pointer-events: none; }
  .toast.err { border-color: #7a2a22; color: #ff9d8c; }
  .confirm { position: absolute; inset: 0; z-index: 40; background: rgba(0, 0, 0, .75); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .confirm .card { width: 100%; max-width: 360px; background: #15120a; border: 1px solid #c9a03e; border-radius: 16px; padding: 18px; }
  .confirm h3 { margin: 0 0 8px; font-size: 16px; color: var(--gold); }
  .confirm p { margin: 0 0 14px; font-size: 14px; color: #cfd6cc; line-height: 1.6; }
  .confirm .row { display: flex; gap: 10px; }
  .confirm .row button { flex: 1; padding: 13px; font: inherit; font-size: 15px; border-radius: 12px; border: 0; }
  .confirm .row .ok { background: linear-gradient(180deg, #ffe9a8, #c9a03e); color: #1a1408; font-weight: 700; }
  .confirm .row .ghost { background: #1a1a1a; color: #cfd6cc; }
</style>
</head>
<body>
<div id="app">
  <div class="top"><b id="crest">casa SLOT</b></div>
  <div class="store off" id="store"><i></i><span id="storeText">接続中…</span></div>
  <div class="acc" id="acc"><div class="plate"><div class="lbl">INSERT BILL · 1 GAME</div><span class="led l"></span><span class="led r"></span><div class="mouth"><div class="throat"></div></div></div></div>
  <div class="hint" id="hint"><span class="arr"></span></div>
  <div id="feedClip"><div class="bill" id="bill"></div></div>
  <div class="msg" id="msg"></div>
  <div class="login hidden" id="login"></div>
  <div class="adm hidden" id="adm"></div>
</div>
<script src="js/engine.js?v=b93"></script>
<script src="cloud-config.js?v=b93"></script>
<script src="js/cloud.js?v=b93"></script>
<script src="js/bill-art.js?v=b93"></script>
<script src="js/bill.js?v=b93"></script>
</body>
</html>
