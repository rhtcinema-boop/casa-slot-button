<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>casa SLOT マスター</title>
<style>
  :root { --bg: #0b0b0d; --panel: #16161a; --line: #2a2a31; --gold: #e9c25e; --gold2: #a57c26; --text: #f3ead0; --sub: #a89f89; --ok: #4cd97b; --ng: #ff9d8c; --warn: #ffb347; --sel: #d9dce3; --selText: #15161a; --onBg: #1f6e4a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #0b0b0dee; border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .08em; color: var(--gold); }
  header .sp { flex: 1; }
  header small { color: var(--sub); font-size: 12px; }
  nav.tabs { display: flex; gap: 6px; padding: 10px 16px 0; }
  nav.tabs button { flex: 1; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--sub); font-size: 15px; font-weight: 600; }
  nav.tabs button.on { background: var(--sel); color: var(--selText); border-color: var(--sel); } /* 今いるタブ＝銀（金は「押すと実行」専用） */
  main { padding: 12px 16px 60px; max-width: 760px; margin: 0 auto; }
  main.wide { max-width: 1120px; } /* プリセット編集は3ステージを横に並べるので広く使う */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 12px 0; }
  .panel h3 { margin: 0 0 10px; font-size: 16px; color: var(--gold); }
  .hint { color: var(--sub); font-size: 13px; margin: 4px 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .lbl { flex: 1; min-width: 0; }
  .stage .row .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; font-variant-numeric: tabular-nums; }
  .row .lbl small { display: block; color: var(--sub); font-size: 12px; }
  .btn { height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: linear-gradient(180deg, #f3d675, #a77a1f); color: #1a1204; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .btn.ghost { background: #232329; color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: #7a211a; color: #fff; }
  .btn.sm { height: 36px; padding: 0 12px; font-size: 14px; }
  .btn:disabled { opacity: .4; }
  input[type=text], input[type=email], input[type=password], input[type=number], select { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #08080a; color: var(--text); padding: 0 12px; font-size: 16px; }
  label.f { display: block; margin: 10px 0; }
  label.f span { display: block; color: var(--sub); font-size: 13px; margin-bottom: 4px; }
  .stepper { display: flex; align-items: center; gap: 4px; flex: none; }
  .stepper button { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: #232329; color: var(--text); font-size: 16px; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .stepper button:active { background: var(--gold); color: #1a1204; }
  .stepper .pv { min-width: 60px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stepper .pv i { font-style: normal; color: var(--sub); font-size: 12px; margin-left: 2px; }
  /* 店舗の説明の入力欄（b65） */
  label.f textarea { display: block; width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #111114; color: var(--text); font: inherit; font-size: 16px; line-height: 1.5; resize: vertical; }
  /* プリセットの色（b61） */
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; flex: none; max-width: 240px; justify-content: flex-end; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #000; background: var(--c); box-shadow: 0 0 0 1px var(--line); touch-action: manipulation; }
  .sw.on { box-shadow: 0 0 0 3px var(--text); }
  .pdot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: baseline; box-shadow: 0 0 0 1px #000; }
  /* 数字を押すと直接入力できる（b58） */
  .stepper .pv { cursor: text; border-radius: 8px; padding: 6px 2px; }
  .stepper .pv:hover { background: rgba(255, 255, 255, .06); }
  .pvin { width: 78px; height: 36px; padding: 0 4px; border: 1px solid var(--gold); border-radius: 8px; background: #111114; color: var(--text); font: inherit; text-align: center; -moz-appearance: textfield; appearance: textfield; }
  .pvin::-webkit-outer-spin-button, .pvin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  /* ステージの箱: 1つが 290px を下回らないように、幅に応じて 3列 → 2列 → 1列 に折り返す（はみ出さない） */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr)); gap: 12px; }
  .stage { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: #111115; min-width: 0; }
  .stage h4 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 6px; font-size: 15px; color: var(--text); letter-spacing: .06em; }
  .stage .row { padding: 7px 0; }
  /* 集計の期間指定 */
  .range { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .range input[type=date] { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #08080a; color: var(--text); padding: 0 12px; font-size: 16px; color-scheme: dark; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  /* 配当表の編集（金額を書き換える・行を足す・消す） */
  .cols.pcols { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
  .prow { gap: 8px; }
  .prow .lbl small { display: inline; margin-left: 8px; }
  .amtin { width: 112px !important; height: 40px !important; padding: 0 8px !important; font-size: 17px !important; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .del { flex: none; width: 32px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--sub); font-size: 18px; line-height: 1; touch-action: manipulation; }
  .del:active { background: var(--ng); color: #fff; }
  .del.ph { border-color: transparent; }
  .trow { gap: 8px; } /* 文字の当たり（2026-10-31） */
  .trow .txtin { flex: 1; min-width: 0; height: 40px; padding: 0 10px; font-size: 16px; font-weight: 700; }
  .trow .tp { display: flex; align-items: center; gap: 4px; flex: none; }
  .trow .tpin { width: 78px; height: 40px; padding: 0 8px; font-size: 17px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .trow .tp i { font-style: normal; color: var(--sub); font-size: 14px; }
  .trow .tl { display: flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; font-size: 14px; color: var(--sub); }
  .trow .tl input { width: 20px; height: 20px; accent-color: #d9b14f; }
  .tchk { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: flex-end; }
  .tchk .tl { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 15px; }
  .tchk .tl input { width: 20px; height: 20px; accent-color: #d9b14f; }
  .addrow { display: flex; align-items: center; gap: 10px; padding: 10px 0 2px; border-top: 1px solid var(--line); }
  .addrow small { color: var(--sub); font-size: 12px; }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .sum { font-size: 12px; font-weight: 700; letter-spacing: 0; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .sum.ok { background: rgba(76, 217, 123, .14); color: var(--ok); }
  .sum.ng { background: rgba(255, 157, 140, .14); color: var(--ng); }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin: 12px 0 4px; }
  /* 保存ボタンは画面の下に張り付ける（長い画面でもスクロールせずに保存できる） */
  .savebar { position: sticky; bottom: 0; z-index: 1; display: flex; align-items: center; gap: 8px; margin: 12px -16px 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: #0b0b0df2; border-top: 1px solid var(--line); backdrop-filter: blur(6px); }
  .savebar .msg { flex: 1; min-width: 0; font-size: 14px; }
  .savebar .msg .err, .savebar .msg .okmsg { margin: 0; }
  .stat { background: #0e0e11; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .stat small { display: block; color: var(--sub); font-size: 12px; }
  .stat b { font-size: 20px; }
  .stat.ok b { color: var(--ok); } .stat.ng b { color: var(--ng); }
  .err { color: var(--ng); font-size: 14px; margin: 6px 0; }
  .okmsg { color: var(--ok); font-size: 14px; margin: 6px 0; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; }
  .list .item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .list .item:first-child { border-top: 0; }
  .list .item .name { flex: 1; min-width: 0; font-weight: 700; }
  .list .item .name small { display: block; color: var(--sub); font-weight: 400; font-size: 12px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #232329; color: var(--sub); font-size: 12px; margin: 2px 4px 2px 0; }
  .chip.on { background: var(--gold); color: #1a1204; }
  .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .check input { width: 22px; height: 22px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); }
  th { color: var(--sub); font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #232329; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #login { max-width: 420px; margin: 40px auto; }
  .empty { color: var(--sub); text-align: center; padding: 20px 0; }
  /* ===== 2026-10-19 見やすく（deploy/MASTER_SIMPLE_NOTES.md の「デザインの決まり」） =====
     金の塗り＝保存・実行（押すと何かが起きる大事なボタン）／灰の枠＝ふつうの操作（編集・戻る・開く）／
     銀の塗り＝今選ばれているもの（タブ・期間・テレビのゲームの今の値）／緑＝ON・動いている・最新／
     オレンジ＝気をつける（古い版・連絡が途切れている・テスト用）／赤＝削除など取り消せない操作・誤り */
  header { flex-wrap: wrap; row-gap: 8px; }
  header h1 { white-space: nowrap; }
  .btn.sel, .btn[aria-pressed="true"] { background: var(--sel); color: var(--selText); border: 0; } /* 今選ばれている（テレビのゲームの枠の「今の値」も同じ見え方にそろえる） */
  .btn.tgl { min-width: 64px; border: 0; }
  .btn.tgl.on { background: var(--onBg); color: #fff; }
  .btn.tgl.off { background: #3a3a42; color: #d6d2c4; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 1.6; background: #26262c; color: var(--sub); white-space: nowrap; vertical-align: middle; }
  .badge.ok { background: rgba(76, 217, 123, .15); color: var(--ok); }
  .badge.warn { background: rgba(255, 179, 71, .15); color: var(--warn); }
  .badge.ng { background: rgba(255, 157, 140, .15); color: var(--ng); }
  .panel h3 small, .sub h4 small { margin-left: 8px; color: var(--sub); font-size: 12px; font-weight: 400; letter-spacing: 0; }
  .acts.start { justify-content: flex-start; }
  /* 畳み（開け閉めできる見出し） */
  details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding-right: 30px; position: relative; min-height: 32px; -webkit-tap-highlight-color: transparent; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: ''; position: absolute; right: 6px; top: 50%; width: 9px; height: 9px; margin-top: -7px; border-right: 2px solid var(--sub); border-bottom: 2px solid var(--sub); transform: rotate(45deg); transition: transform .15s; }
  details.fold[open] > summary::after { transform: rotate(225deg); margin-top: -2px; }
  details.fold > summary h3, details.fold > summary h4 { margin: 0; }
  details.fold > summary .fsum { color: var(--sub); font-size: 13px; }
  details.fold[open] > .fbody { margin-top: 10px; }
  details.panel.fold > summary { min-height: 36px; }
  details.more { margin: 2px 0 8px; }
  details.more > summary { min-height: 28px; padding-right: 22px; color: var(--sub); font-size: 13px; display: inline-flex; }
  details.more > summary::after { width: 6px; height: 6px; right: 4px; margin-top: -5px; }
  details.more[open] > summary::after { margin-top: -1px; }
  details.more > .fbody { margin-top: 4px !important; }
  details.more .hint { margin: 0; padding: 8px 10px; background: #101013; border-radius: 10px; }
  .sub { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 12px 0; background: #111115; }
  .sub h4 { margin: 0 0 4px; font-size: 15px; color: var(--text); }
  .opt { padding: 4px 0; border-top: 1px solid var(--line); }
  .opt:first-child { border-top: 0; }
  .opt details.more { margin: -4px 0 4px 32px; }
  .rare { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .rare > div { flex: 1; min-width: 0; }
  .rare small { display: block; color: var(--sub); font-size: 12px; }
  /* 店舗の状態・プリセットの一覧（カード） */
  .phead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .phead h3 { margin: 0; }
  .upd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .upd .lv { color: var(--sub); font-size: 13px; }
  .upd .lv b { color: var(--text); font-size: 15px; }
  .oldnote { color: var(--warn); font-size: 13px; }
  .oldnote:empty { display: none; }
  .slist .scard { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .slist .scard:first-child { border-top: 0; }
  .sinfo { flex: 1; min-width: 0; }
  .sname { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-weight: 700; font-size: 17px; }
  .smeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 4px; color: var(--sub); font-size: 13px; }
  .smeta b { color: var(--text); }
  .smeta.sm { font-size: 12px; margin-top: 2px; }
  .pchip { color: var(--text); font-weight: 600; }
  .pchip .pdot, .sname .pdot { margin-right: 6px; }
  .swarn { color: var(--ng); font-weight: 700; font-size: 13px; margin-top: 4px; }
  .check input { flex: none; }
  .stepper button { background: #2e2e36; border-color: #3a3a44; } /* ◀ ▶ を数字と見分けやすく */
  .tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .summary { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  /* ===== 2026-10-19 その 2: 店長が初めて見ても分かるように（見出しはやりたいことの言葉・説明は 1 行・専門用語なし） ===== */
  .phead .fsum { color: var(--sub); font-size: 13px; }
  .ago { color: var(--sub); font-size: 12px; }
  .badge.none:empty { display: none; }
  .slist .scard { flex-wrap: wrap; }
  .sctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .qpre { display: flex; align-items: center; gap: 6px; margin: 0; }
  .qpre span { color: var(--sub); font-size: 12px; white-space: nowrap; }
  .qpre select { width: auto; min-width: 150px; height: 36px; font-size: 15px; }
  .btn[hidden] { display: none; }
  .updbox { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; margin: 12px 0 4px; padding: 12px 14px; border-radius: 12px; background: #111115; border: 1px solid var(--line); }
  .updbox.warn { background: rgba(255, 179, 71, .10); border-color: rgba(255, 179, 71, .45); }
  .updbox .oldnote { font-size: 15px; font-weight: 600; }
  .updbox.ok .oldnote { color: var(--ok); font-size: 13px; font-weight: 400; }
  .updbox .oldnote:empty { display: block; } /* ボタンの位置がずれないように */
  .updbox .btn { margin-left: auto; }
  /* テレビに映すゲーム（js/derbyswitch-master.js の中身は変えない約束なので、見出しの言葉と長い説明だけを見た目で差し替える） */
  #dswPanel > h3 { font-size: 0; }
  #dswPanel > h3::before { content: 'テレビに映すゲーム'; font-size: 16px; }
  #dswPanel > h3 + p.hint { display: none; } /* 約 200 字の説明（文は部品の中に残っている） */
  #dswPanel .panel > p.hint { display: none; } /* ログイン欄の 2 行目（見出しの「切り替えるときだけ」で足りる） */
  #dswPanel .list .item .name small { display: none; } /* 「casa DERBY の店舗 shibuya｜いま: …」→ 今の値は ✓ つきの銀のボタンで分かる */
  #dswPanel .btn[aria-pressed="true"]::before { content: '✓ '; }
  .updbox .oldnote small { display: block; color: var(--sub); font-size: 12px; font-weight: 400; margin-top: 2px; }
  .sname .badge.warn, .sname .badge.ok { background: transparent; border: 1px solid currentColor; } /* 「更新が必要」（版）は枠だけ。「つながっていません」（塗り）と見分ける */
  .stage h4 { position: sticky; top: 0; z-index: 1; margin: -10px -12px 6px; padding: 10px 12px 6px; background: #111115; border-radius: 14px 14px 0 0; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--gold); } /* いまどの STAGE を直しているか、スクロールしても見える */
  .stage .row .lbl.wrap { white-space: normal; line-height: 1.25; font-size: 15px; } /* 「次の STAGE へ」がスマホで「次の STAGE…」と切れていた */
  .nw, .panel h3 small { white-space: nowrap; }
  label.f span small.lsub { display: inline; margin-left: 8px; color: var(--sub); font-size: 12px; }
  .sub h4 small { display: block; margin: 2px 0 0; }
  .qnote { color: var(--warn); font-size: 12px; white-space: nowrap; }
  .qnote[hidden] { display: none; }
  .usenote { margin: 0 0 6px; padding: 8px 12px; border-radius: 10px; background: rgba(255, 179, 71, .10); border: 1px solid rgba(255, 179, 71, .35); color: var(--text); font-size: 14px; }
  .usenote b { color: var(--warn); }
  td:first-child { white-space: nowrap; }
  /* ログインする前は、テレビの切り替えのボタンが押せない理由を 1 行で（部品の中身は変えない） */
  #dswPanel:has(#dswPw) .list::before { content: 'ログインすると、下のボタンで切り替えられます'; display: block; color: var(--sub); font-size: 13px; margin: 4px 0 2px; }
  @media (max-width: 600px) {
    .slist .scard { padding: 8px 0; gap: 4px; position: relative; }
    .qpre select { height: 34px; }
    table { font-size: 13px; } th, td { padding: 8px 4px; }
    .slist .badge { font-size: 11px; padding: 1px 8px; } .slist .smeta { margin-top: 2px; } .slist .sname { font-size: 16px; } /* 一覧を少しでも短く */
    .row:has(.swatches) { flex-wrap: wrap; } .swatches { max-width: none; justify-content: flex-start; } /* 名前の色: 説明を 1 行に、色は下の段に */
    .sctl .qnote { flex-basis: 100%; text-align: right; } /* 選ぶと出る知らせは下の段に（選択欄を狭めない） */
    #dswPanel .panel > h3 { font-size: 13px !important; } /* 「casa DERBY にログイン（切り替えるときだけ）」を 1 行に */
    .slist .scard .sinfo { flex: 1 1 100%; } /* 名前の段を横いっぱいに（ボタンは下の段へ）。当たりの設定の一覧で名前が 1 文字ずつ折り返していた */
    .slist .scard .sname { padding-right: 120px; min-height: 36px; } /* 右上の「お店の設定」の場所をあける */
    .sctl .sedit { position: absolute; top: 8px; right: 0; }
    .sctl { width: 100%; justify-content: flex-start; }
    .qpre { flex: 1; min-width: 0; }
