<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b101b">
<meta name="robots" content="noindex">
<title>casa DERBY スマホで「レースを見る」の試し</title>
<!-- Web デモの「スマホだけ」の試しのページ（2026-10-30 オーナー「iPhone で URL を開いて試したい」）。tools/build-webdemo.js が webdemo/phone.html に置く。
     テレビの画面（3D の重いページ）は出さない。にせ Firestore と決める係（レースを作る・決める・発表する）はこのページの中で動く（phone.js）。
     開くと: 短い案内 → 投票の時間になったら自動で 1 票（渋谷・会計番号はでたらめ・ニックネーム「テスト」・1着→2着はでたらめ）→ ふつうの投票ページ（v2/bet.html）→「レースを見る」。
     見る窓は本番と同じ道（3D が先。デモだけ「図で見る」「3Dで見る」で切り替え）。音は出さない -->
<style>
html, body { margin: 0; height: 100%; background: #0b101b; color: #fff; font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; }
body { display: flex; flex-direction: column; height: 100dvh; }
.bar { flex: none; display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 4px 10px; padding-top: max(4px, env(safe-area-inset-top)); background: #141e31; border-bottom: 1px solid rgba(255, 255, 255, .12); font-size: 12px; color: #dfe7f3; }
.bar b { color: #ffd84a; font-weight: 900; white-space: nowrap; }
.bar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frame { position: relative; flex: 1; min-height: 0; }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0b101b; }
.intro { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; background: #0b101b; text-align: center; }
.intro[hidden] { display: none; }
.intro .in { max-width: 420px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.intro h1 { margin: 0; font-size: 20px; } .intro p { margin: 0; font-size: 14px; color: #b9c6da; line-height: 1.7; }
.intro .st { font-size: 15px; font-weight: 900; color: #ffd84a; }
.intro button { height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #2f7cf6; color: #fff; font: inherit; font-weight: 900; }
</style>
</head>
<body>
<div class="bar"><b>試し</b><span id="pStatus">準備中…</span></div>
<div class="frame">
  <iframe id="fCu" title="投票ページ"></iframe>
  <div class="intro" id="pIntro"><div class="in">
    <h1>スマホで「レースを見る」の試し</h1>
    <p>このページだけでレースが 3 分ごとに進みます（音は出ません）。<br>投票の時間になると、自動で 1 票入れます（渋谷・ニックネーム「テスト」）。<br>そのあと「レースを見る」を押すと、テレビと同じレースを見られます。</p>
    <p class="st" id="pIntroSt">準備中…</p>
    <button type="button" id="pIntroBtn">投票ページを見る</button>
  </div></div>
</div>
<script src="js/engine.js?v=p1"></script>
<script src="v2/outcome.js?v=p1"></script>
<script src="v2/core.js?v=p1"></script>
<script src="v2/fake-firestore.js?v=p1"></script>
<script src="v2/client-firestore.js?v=p1"></script>
<script src="demo-rules.js?v=p1"></script>
<script src="phone.js?v=p1"></script>
</body>
</html>
