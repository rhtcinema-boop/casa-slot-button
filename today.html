<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今日の当たり">
<meta name="theme-color" content="#0b0f0c">
<meta name="format-detection" content="telephone=no">
<title>casa SLOT 今日の当たり</title>
<link rel="icon" href="icon-180.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --gold: #ffd773; --dim: #9aa89c; --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #070a08; }
  body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at 50% 0%, #13231a, #070a08 60%) fixed; color: #e8e3d2; font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 14px) 16px calc(var(--sab) + 30px); }
  h1 { margin: 0; text-align: center; font-size: 14px; letter-spacing: .25em; color: var(--gold); }
  .day { text-align: center; font-size: 13px; color: var(--dim); margin: 8px 0 14px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; padding: 9px 14px; border-radius: 999px; border: 1px solid #3a3320; background: #15120a; color: #cfd6cc; font: inherit; font-size: 14px; }
  .chips button.on { background: linear-gradient(180deg, #ffe9a8, #c9a03e); color: #1a1408; font-weight: 700; border-color: #c9a03e; }
  .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .sum div { background: rgba(10, 9, 6, .8); border: 1px solid #2a2416; border-radius: 14px; padding: 12px 14px; }
  .sum span { display: block; font-size: 12px; color: var(--dim); letter-spacing: .1em; }
  .sum b { display: block; font-size: 28px; margin-top: 4px; background: linear-gradient(180deg, #fff1bd, #c9a03e); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .list { background: rgba(10, 9, 6, .8); border: 1px solid #2a2416; border-radius: 14px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-top: 1px solid #1d1a10; }
  .row:first-child { border-top: 0; }
  .row small { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .row .st { font-size: 15px; }
  .row .st i { display: block; font-style: normal; font-size: 12px; color: var(--dim); margin-top: 2px; }
  .row b { font-size: 20px; font-variant-numeric: tabular-nums; color: #ffe9a8; }
  .row b.big { color: #ff9a3c; }
  .row b.huge { background: linear-gradient(180deg, #fff1bd, #ff8c2a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .empty { padding: 28px 14px; text-align: center; color: var(--dim); font-size: 14px; line-height: 1.7; }
  .foot { margin-top: 14px; text-align: center; font-size: 12px; color: #6b7570; line-height: 1.7; }
  .foot b { color: #35e07a; font-weight: 400; }
  .foot b.off { color: #ff8c7a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>casa SLOT ・ 今日の当たり</h1>
  <div class="day" id="day">読み込み中…</div>
  <div class="chips" id="chips"></div>
  <div class="sum"><div><span>当たり本数</span><b id="n">—</b></div><div><span>合計</span><b id="total">—</b></div></div>
  <div class="list" id="list"><div class="empty">読み込んでいます…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script src="cloud-config.js?v=b100"></script>
<script src="js/cloud.js?v=b100"></script>
<script src="js/today.js?v=b100"></script>
</body>
</html>
